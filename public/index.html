<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <!-- iOS "Add to Home Screen": without these the icon gets a gray
       placeholder and the page opens in Safari chrome, not as an app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Patente Pro">
  <title>Patente Pro</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <a class="skip-link" href="#view">SKIP TO CONTENT</a>
  <header class="masthead">
    <a class="brand" href="#/">
      <span class="brand__name">Patente Pro<span class="brand__dot" aria-hidden="true"></span></span>
      <small class="brand__tag">Italian theory master</small>
    </a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#/" data-route="dashboard">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M3 10.5 12 3l9 7.5V21h-6v-7H9v7H3z"/></svg>
        <span>HOME</span>
      </a>
      <a href="#/theory" data-route="theory">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M2 4h7a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H2zM22 4h-7a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h7z"/></svg>
        <span>THEORY</span>
      </a>
      <a href="#/practice" data-route="practice">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.5"/></svg>
        <span>PRACTICE</span>
      </a>
      <a href="#/exam" data-route="exam">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
        <span>EXAM</span>
      </a>
      <a href="#/mistakes" data-route="mistakes">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
        <span>MISTAKES</span>
      </a>
      <a href="#/settings" data-route="settings">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="7" cy="18" r="2" fill="currentColor"/></svg>
        <span>SETTINGS</span>
      </a>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="ds-notice" id="privacy-notice">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.5"/></svg>
    <span>Your progress stays on this device.</span>
    <button class="ds-notice__btn" id="privacy-notice-ok">Got it</button>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
