<!-- @dsCard group="Progress" height=230 subtitle="Bar plus number; accent for progress, ok for mastery" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProgressBar — preview</title><style>body.ds{padding:24px;}</style></head>
<body class="ds">
<div style="display:grid;gap:22px;max-width:520px"><div><div class="label" style="margin-bottom:8px">Not started</div><div class="ds-meter"><span class="ds-bar " role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Not started"></span><span class="ds-meter__val">0%</span></div></div><div><div class="label" style="margin-bottom:8px">In progress</div><div class="ds-meter"><span class="ds-bar " role="progressbar" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100" aria-label="In progress"><span class="ds-bar__fill" style="--v:42%"></span></span><span class="ds-meter__val">42%</span></div></div><div><div class="label" style="margin-bottom:8px">Mastered</div><div class="ds-meter"><span class="ds-bar ds-bar--ok" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-label="Mastered"><span class="ds-bar__fill" style="--v:100%"></span></span><span class="ds-meter__val">100%</span></div></div></div>

</body>
</html>
