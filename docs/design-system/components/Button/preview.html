<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title><style>body.ds{padding:24px;}</style></head>
<body class="ds">
<div style="display:grid;gap:28px;max-width:720px">
 <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center">
  <button class="ds-btn ds-btn--primary">Begin exam</button>
  <button class="ds-btn">Not yet</button>
  <button class="ds-btn ds-btn--ghost">Skip</button>

 </div>
 <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center">
  <button class="ds-btn ds-btn--primary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M13 5l7 7-7 7"/></svg> Continue chapter 1</button>
  <button class="ds-btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4M11 5l-7 7 7 7"/></svg> Quit</button>
 </div>
 <button class="ds-btn ds-btn--primary ds-btn--lg ds-btn--block">Next question <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M13 5l7 7-7 7"/></svg></button>
 </div>

</body>
